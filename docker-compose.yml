version: '3.8'

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: safeheal_owner
      POSTGRES_PASSWORD: owner_password
      POSTGRES_DB: safeheal
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/init-roles.sql
